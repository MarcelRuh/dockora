services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dockora-api
    restart: unless-stopped
    ports:
      - "${DOCKORA_API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: file:/data/dockora.db
      BACKUP_DIR: /data/backups
      DOCKER_SOCKET: /var/run/docker.sock
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COMPOSE_SEARCH_PATHS: ${COMPOSE_SEARCH_PATHS:-/opt,/srv,/home}
    volumes:
      - dockora-data:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Compose-Discovery (read-only) – später erweiterbar
      - /opt:/opt:ro
      - /srv:/srv:ro
      - /home:/home:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        DOCKORA_API_URL: http://api:3001
    container_name: dockora-web
    restart: unless-stopped
    ports:
      - "${DOCKORA_WEB_PORT:-3000}:3000"
    environment:
      DOCKORA_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  # Optional: Same-Origin Proxy (SSE/WS) – docker compose --profile proxy up
  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: dockora-proxy
    restart: unless-stopped
    ports:
      - "${DOCKORA_PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  dockora-data:
