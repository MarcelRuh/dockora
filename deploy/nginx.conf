# Reverse-Proxy: Web + API Same-Origin (SSE + WebSocket Upgrade)
# Beispiel: docker compose --profile proxy up
#
# Docker DNS must be re-resolved: after `compose up --build` web/api get new IPs.
# Static upstream{} caches the first resolve forever → 502 until nginx restarts.
# Variable proxy_pass + embedded Docker DNS (127.0.0.11) fixes that.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 64m;

  # Docker embedded DNS; short TTL so recreate of api/web is picked up quickly
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # API inkl. SSE (kein Buffering) und WebSocket
  location /api/ {
    set $dockora_api api:3001;
    proxy_pass http://$dockora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    set $dockora_web web:3000;
    proxy_pass http://$dockora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
