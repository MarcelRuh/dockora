# Reverse-Proxy: Web + API Same-Origin (SSE + WebSocket Upgrade)
# Beispiel: docker compose --profile proxy up

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream dockora_web {
  server web:3000;
}

upstream dockora_api {
  server api:3001;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 64m;

  # API inkl. SSE (kein Buffering) und WebSocket
  location /api/ {
    proxy_pass http://dockora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://dockora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
