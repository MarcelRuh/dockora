name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name prefix
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags_api=${OWNER}/dockora-api:${VERSION},${OWNER}/dockora-api:latest" >> "$GITHUB_OUTPUT"
            echo "tags_web=${OWNER}/dockora-web:${VERSION},${OWNER}/dockora-web:latest" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ inputs.tag || 'latest' }}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags_api=${OWNER}/dockora-api:${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags_web=${OWNER}/dockora-web:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags_api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          build-args: |
            DOCKORA_API_URL=http://api:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max
